name: keepalive

on:
  schedule:
    - cron: "0 6 */3 * *"   # every 3 days at 06:00 UTC
  workflow_dispatch:         # allows manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node keepalive.mjs
        env:
          MONGODB_URI_COLABS_DOCS: ${{ secrets.MONGODB_URI_COLABS_DOCS }}
          MONGODB_URI_CAREPOINT: ${{ secrets.MONGODB_URI_CAREPOINT }}
          MONGODB_URI_DOORSTEP: ${{ secrets.MONGODB_URI_DOORSTEP }}
          MONGODB_URI_DELIVEREASE: ${{ secrets.MONGODB_URI_DELIVEREASE }}
          MONGODB_URI_ECOMMERCE: ${{ secrets.MONGODB_URI_ECOMMERCE }}
          MONGODB_URI_RIVVO: ${{ secrets.MONGODB_URI_RIVVO }}
          MONGODB_URI_SHIREME: ${{ secrets.MONGODB_URI_SHIREME }}